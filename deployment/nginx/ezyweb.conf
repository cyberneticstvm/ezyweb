server {
    listen 80;
    listen [::]:80;
    server_name ezyweb.in www.ezyweb.in app.ezyweb.in admin.ezyweb.in *.ezyweb.in;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name ezyweb.in www.ezyweb.in app.ezyweb.in admin.ezyweb.in *.ezyweb.in;

    root /var/www/ezyweb/current/public;
    index index.php;
    client_max_body_size 12m;

    ssl_certificate /etc/letsencrypt/live/ezyweb.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ezyweb.in/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:EzywebTLS:10m;
    ssl_session_timeout 1d;

    access_log /var/log/nginx/ezyweb.access.log;
    error_log /var/log/nginx/ezyweb.error.log warn;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_param HTTP_X_FORWARDED_PROTO $scheme;
        fastcgi_read_timeout 120s;
    }

    location ~* ^/build/.*\.(?:css|js|woff2|png|jpg|jpeg|gif|webp|avif|svg)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
        try_files $uri =404;
    }

    location = /up/ready {
        allow 127.0.0.1;
        allow ::1;
        # Add the monitoring service IP before enabling remote probes.
        deny all;
        try_files $uri /index.php?$query_string;
    }

    location ~ /\. {
        deny all;
    }

    location ~* \.(?:env|log|ini|conf|sql|bak)$ {
        deny all;
    }
}
