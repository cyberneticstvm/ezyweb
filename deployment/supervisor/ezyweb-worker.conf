[program:ezyweb-worker]
process_name=%(program_name)s_%(process_num)02d
command=/usr/bin/php /var/www/ezyweb/current/artisan queue:work redis --queue=default --sleep=3 --tries=3 --backoff=10,30,60 --timeout=120 --max-time=3600
directory=/var/www/ezyweb/current
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=2
redirect_stderr=true
stdout_logfile=/var/log/supervisor/ezyweb-worker.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=5
stopwaitsecs=150
