<VirtualHost *:80>
    ServerName ezyweb.in
    ServerAlias www.ezyweb.in app.ezyweb.in admin.ezyweb.in *.ezyweb.in
    Redirect permanent / https://ezyweb.in/
</VirtualHost>

<VirtualHost *:443>
    ServerName ezyweb.in
    ServerAlias www.ezyweb.in app.ezyweb.in admin.ezyweb.in *.ezyweb.in
    DocumentRoot /var/www/ezyweb/current/public

    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/ezyweb.in/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/ezyweb.in/privkey.pem

    <Directory /var/www/ezyweb/current/public>
        AllowOverride All
        Options FollowSymLinks
        Require all granted
    </Directory>
</VirtualHost>
